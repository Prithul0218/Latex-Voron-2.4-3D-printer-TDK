# ========================================================================
# Diode laser module (12 V supply + TTL PWM) - reference configuration (Klipper)
# Replace the pin names with your own.
# Final, tested printer.cfg will be added to this folder.
# ========================================================================
#
# Rule used by every print file: the power pin is switched on once at the
# start (LASER_ARM) and off once at the end (LASER_DISARM). During a print
# only the PWM value changes (LASER_PWM), so switching the power pin by hand
# works as a lockout that no print file overrides.
#
# Safety tested: emergency stop drops both pins to 0 immediately; pulling the
# CAN cable while lasing turns the beam off within 1 s (watchdog on laser_pwm).

[output_pin laser_power]
# 12 V module supply, plain on/off (no PWM)
pin: TOOLBOARD:PIN_LASER_POWER   # e.g. a MOSFET output switching the module supply
pwm: False
value: 0
shutdown_value: 0

[pwm_tool laser_pwm]
# TTL PWM to the module. maximum_mcu_duration only exists on [pwm_tool]:
# the MCU turns the beam off by itself if the host stops refreshing for 1 s.
pin: TOOLBOARD:PIN_LASER_PWM     # TTL input of the module
hardware_pwm: False          # software PWM; hardware PWM + watchdog has caused "Missed scheduling" shutdowns elsewhere
cycle_time: 0.001            # 1 kHz
value: 0
shutdown_value: 0
maximum_mcu_duration: 1.0

# ------------------------------------------------------------------------
# Macros
# ------------------------------------------------------------------------

[gcode_macro LASER_ARM]
description: Power the laser module (PWM held at 0). Once per print, at the start.
gcode:
    SET_PIN PIN=laser_pwm VALUE=0
    SET_PIN PIN=laser_power VALUE=1
    G4 P100                   # module wake-up

[gcode_macro LASER_DISARM]
description: PWM off, then module power off. Once per print, at the end.
gcode:
    SET_PIN PIN=laser_pwm VALUE=0
    SET_PIN PIN=laser_power VALUE=0

[gcode_macro LASER_PWM]
description: Beam power only (S=0-255). Never touches the laser_power pin.
gcode:
    {% set max_duty = 1.0 %}  # lower this to cap the maximum duty
    {% set s = [[params.S|default(0)|float, 0.0]|max, 255.0]|min %}
    SET_PIN PIN=laser_pwm VALUE={ (s / 255.0 * max_duty)|round(4) }

# Optional: hook into your print macros
#   PRINT_START  -> LASER_ARM before the purge line (or let the post-processor add it)
#   PRINT_END / CANCEL_PRINT -> LASER_DISARM
#   PAUSE        -> LASER_PWM S=0 as the first line

# Required by the post-processor's per-object laser power
[exclude_object]

# Small extra push at each line start (syringe compliance). Retraction stays 0
# because drive backlash defeats small reverse plunger moves.
[firmware_retraction]
retract_length: 0
unretract_extra_length: 0.3   # tune for your syringe
retract_speed: 2
unretract_speed: 2
